<style>
:root{ --grass:#8fd18b; --grass-d:#4f9e4a; --earth:#f6f2e6; --earth-l:#e6dfc8; --wood:#8a5a2b; --wood-d:#5c3a1a; }
.stage-card{overflow:auto}

.task{flex:none;border-radius:16px;padding:12px 16px;background:#f2fbf1;border:2px solid #b9e3b5;font-size:1.08rem;font-weight:650;line-height:1.4}
.task b{color:var(--grass-d)}

.fields{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--n,1),minmax(0,1fr));gap:14px;align-items:start}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field h3{margin:0;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field-svg{width:100%;height:auto;display:block;touch-action:none;-webkit-user-select:none;user-select:none;border-radius:14px;background:#fbf8ef;border:2px solid var(--earth-l);cursor:crosshair}
.field.locked .field-svg{cursor:default}
.cell{fill:var(--earth);stroke:var(--earth-l);stroke-width:1}
.cell.on{fill:var(--grass);stroke:#7cc177}
.cell.ghost{fill:#cfeccb}
.fence{fill:none;stroke:var(--wood);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.post{fill:var(--wood-d)}
.sheep{font-size:24px;dominant-baseline:central;text-anchor:middle;pointer-events:none}
.sheep.pop{animation:spop .4s var(--wobble) both}
@keyframes spop{from{transform:scale(0)}}
.sheep{transform-box:fill-box;transform-origin:center}
.readout{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:800;font-size:.95rem;background:#fff;border:2px solid var(--line)}
.chip.grass{border-color:#b9e3b5;background:#f2fbf1;color:#2f6d2b}
.chip.wood{border-color:#e2c9a8;background:#fbf4ea;color:var(--wood-d)}
.chip.warn{border-color:var(--err-line);background:var(--err-soft);color:var(--err)}
.roll{display:flex;align-items:center;gap:10px;font-weight:750;font-size:.9rem;color:var(--wood-d)}
.roll .track{flex:1;height:12px;border-radius:999px;background:#efe6d6;overflow:hidden;min-width:80px}
.roll .fill{height:100%;background:var(--wood);border-radius:999px;transition:width .25s}
.roll.over .fill{background:var(--err)}
.outside{font-size:1.3rem;letter-spacing:2px}

/* ---------- Pannello ---------- */
.row{align-items:stretch}
.row .btn{flex:1}
.hist{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
.hist th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:4px 6px}
.hist td{padding:5px 6px;border-top:1px solid #eef0f8;font-weight:700}
.claim{font-size:1.08rem;font-weight:700;line-height:1.4;background:#fff8e6;border:2px dashed #e9c46a;border-radius:14px;padding:12px 14px}
.claim small{display:block;font-size:.78rem;color:#9a6a00;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.claims{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.claims li{font-size:.84rem;padding:6px 9px;border-radius:10px;background:#f7f8fd;border:1px solid #e6e9f5;display:flex;gap:8px}
.claims li.ok{background:var(--ok-soft);border-color:var(--ok-line)}
.claims li.lost{background:var(--err-soft);border-color:var(--err-line)}
.claims li.cur{border-color:var(--primary)}
.claims .st{flex:none;font-weight:800}

@media (min-width:921px) and (min-height:680px){
  .fields.one{justify-items:center}
  .fields.one .field{width:100%;max-width:calc((100dvh - 350px) * 1.31)}
}
@media (max-width:620px){
  .fields{grid-template-columns:1fr}
}

<div class="app">

<script type="module">
import { lab, $, esc, plural, rnd, pick, reduceMotion } from '/_lab/lab.js';

/* Il recinto delle pecore: area e perimetro su una quadrettatura.
   Un quadretto di prato = 1 pecora; un lato di quadretto = 1 m di recinto.
   Il milieu mette alla prova la concezione "stesso recinto, stesso prato". */

const el = { task:$('#task'), fields:$('#fields'), tool:$('#tool') };
const app = lab({
  id:'recinto',
  sym:{ onChange(){ for (const k of ['f', 'A', 'B']) app.L[k]?.repaint(); app.level.render?.(); } }
});
const W_AREA = () => app.sym ? 'Area' : 'Prato';
const W_PER = () => app.sym ? 'Perimetro' : 'Recinto';

/* ---------------- Geometria dei prati ---------------- */
const key = (c, r) => c + ',' + r;
const unkey = k => k.split(',').map(Number);
function measureShape(cells){
  let per = 0;
  for (const k of cells){
    const [c, r] = unkey(k);
    for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]) if (!cells.has(key(c + dc, r + dr))) per++;
  }
  return { area:cells.size, per };
}
function connected(cells){
  if (cells.size <= 1) return true;
  const start = cells.values().next().value, seen = new Set([start]), q = [start];
  while (q.length){
    const [c, r] = unkey(q.pop());
    for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]){ const k = key(c + dc, r + dr); if (cells.has(k) && !seen.has(k)){ seen.add(k); q.push(k); } }
  }
  return seen.size === cells.size;
}
const minPer = a => 2 * Math.ceil(2 * Math.sqrt(a));
const maxPer = a => 2 * a + 2;
const possible = (a, p) => p % 2 === 0 && p >= minPer(a) && p <= maxPer(a);

/* Costruisce un prato con area a e recinto p dentro una griglia cols×rows: un blocco compatto
   largo w più una "coda" dritta. Serve al milieu per mostrare un controesempio. */
function buildShape(a, p, cols, rows){
  for (let w = 1; w <= Math.min(cols, a); w++){
    for (let k = a; k >= 0; k--){
      const cells = new Set();
      for (let i = 0; i < k; i++) cells.add(key(i % w, Math.floor(i / w)));
      if (Math.ceil(k / w) > rows) continue;
      let c = k ? w : 0, r = 0, ok = true;
      for (let i = 0; i < a - k; i++){
        if (c >= cols){ c = cols - 1; r++; }
        if (r >= rows || cells.has(key(c, r))){ ok = false; break; }
        cells.add(key(c, r));
        if (r === 0) c++; else r++;
      }
      if (!ok || cells.size !== a || !connected(cells)) continue;
      if (measureShape(cells).per === p) return cells;
    }
  }
  // ripiego: crescita casuale
  for (let t = 0; t < 3000; t++){
    const list = [key(rnd(0, cols - 1), rnd(0, rows - 1))], cells = new Set(list), stringy = Math.random() * .9;
    for (let step = 0; cells.size < a && step < 400; step++){
      // "stringy" alto: cresce dalla punta (prati lunghi); basso: da un quadretto qualsiasi (prati raccolti)
      const from = Math.random() < stringy ? list[list.length - 1 - Math.floor(Math.random() * Math.min(3, list.length))] : pick(list);
      const [c, r] = unkey(from), [dc, dr] = pick([[1,0],[-1,0],[0,1],[0,-1]]), nc = c + dc, nr = r + dr, k = key(nc, nr);
      if (nc >= 0 && nc < cols && nr >= 0 && nr < rows && !cells.has(k)){ cells.add(k); list.push(k); }
    }
    if (cells.size === a && measureShape(cells).per === p) return cells;
  }
  return null;
}
const rect = (c0, r0, w, h) => { const s = new Set(); for (let r = r0; r < r0 + h; r++) for (let c = c0; c < c0 + w; c++) s.add(key(c, r)); return s; };

/* ---------------- Il campo (SVG disegnabile) ---------------- */
const CELL = 40, PAD = 14;
function makeField(host, { cols, rows, label, onChange }){
  const W = cols * CELL + 2 * PAD, H = rows * CELL + 2 * PAD;
  host.innerHTML = `${label ? `<h3>${label}</h3>` : ''}<svg class="field-svg" viewBox="0 0 ${W} ${H}" role="application" aria-label="Quadrettatura: tocca o trascina per colorare il prato">
    <g class="cells"></g><g class="fenceg"></g><g class="sheepg"></g></svg><div class="readout"></div>`;
  const svg = host.querySelector('svg'), gCells = svg.querySelector('.cells'), gFence = svg.querySelector('.fenceg'), gSheep = svg.querySelector('.sheepg');
  const readout = host.querySelector('.readout');
  let cells = new Set(), locked = false, mode = null, last = null, extra = '';
  let h = '';
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) h += `<rect class="cell" data-k="${key(c, r)}" x="${PAD + c * CELL}" y="${PAD + r * CELL}" width="${CELL}" height="${CELL}"/>`;
  gCells.innerHTML = h;
  const rects = new Map([...gCells.children].map(n => [n.dataset.k, n]));

  function paint(){
    rects.forEach((n, k) => n.classList.toggle('on', cells.has(k)));
    let d = '';
    const posts = new Set();
    for (const k of cells){
      const [c, r] = unkey(k), x = PAD + c * CELL, y = PAD + r * CELL;
      const seg = (x1, y1, x2, y2) => { d += `M${x1} ${y1}L${x2} ${y2}`; posts.add(x1 + ',' + y1); posts.add(x2 + ',' + y2); };
      if (!cells.has(key(c, r - 1))) seg(x, y, x + CELL, y);
      if (!cells.has(key(c, r + 1))) seg(x, y + CELL, x + CELL, y + CELL);
      if (!cells.has(key(c - 1, r))) seg(x, y, x, y + CELL);
      if (!cells.has(key(c + 1, r))) seg(x + CELL, y, x + CELL, y + CELL);
    }
    gFence.innerHTML = (d ? `<path class="fence" d="${d}"/>` : '') + [...posts].map(p => { const [x, y] = p.split(','); return `<circle class="post" cx="${x}" cy="${y}" r="3.6"/>`; }).join('');
    const m = measureShape(cells);
    readout.innerHTML = `<span class="chip grass">🌱 ${W_AREA()}: ${plural(m.area, 'quadretto', 'quadretti')}</span><span class="chip wood">🪵 ${W_PER()}: ${m.per} m</span>${extra}`
      + (cells.size && !connected(cells) ? '<span class="chip warn">⚠ due pezzi</span>' : '');
  }
  function cellAt(e){
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const q = p.matrixTransform(svg.getScreenCTM().inverse());
    const c = Math.floor((q.x - PAD) / CELL), r = Math.floor((q.y - PAD) / CELL);
    return c >= 0 && c < cols && r >= 0 && r < rows ? key(c, r) : null;
  }
  function apply(k){
    if (!k || k === last) return;
    last = k;
    const had = cells.has(k);
    if (mode === 'paint' && !had) cells.add(k); else if (mode === 'erase' && had) cells.delete(k); else return;
    gSheep.innerHTML = '';
    paint(); onChange?.();
  }
  svg.addEventListener('pointerdown', e => {
    if (locked) return;
    const k = cellAt(e); if (!k) return;
    e.preventDefault(); svg.setPointerCapture(e.pointerId);
    mode = cells.has(k) ? 'erase' : 'paint'; last = null; apply(k);
  });
  svg.addEventListener('pointermove', e => { if (mode) apply(cellAt(e)); });
  const end = () => { mode = null; last = null; };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  paint();

  return {
    get cells(){ return cells; },
    get m(){ return measureShape(cells); },
    get ok(){ return cells.size > 0 && connected(cells); },
    set(s){ cells = new Set(s); gSheep.innerHTML = ''; paint(); onChange?.(); },
    clear(){ this.set([]); },
    lock(b){ locked = b; host.classList.toggle('locked', b); },
    note(html){ extra = html || ''; paint(); },
    repaint: paint,
    sheep(n){ // le pecore occupano i quadretti, una per quadretto
      const list = [...cells].map(unkey).sort((a, b) => a[1] - b[1] || a[0] - b[0]).slice(0, n);
      gSheep.innerHTML = list.map(([c, r], i) => `<text class="sheep${reduceMotion ? '' : ' pop'}" x="${PAD + c * CELL + CELL / 2}" y="${PAD + r * CELL + CELL / 2}" style="animation-delay:${Math.min(i * 30, 900)}ms">🐑</text>`).join('');
      return Math.max(0, n - cells.size);
    }
  };
}

/* ---------------- Livelli ---------------- */
function fieldsLayout(n){
  el.fields.style.setProperty('--n', n);
  el.fields.classList.toggle('one', n === 1);
  el.fields.innerHTML = Array.from({ length:n }, (_, i) => `<div class="field" id="f${i}"></div>`).join('');
  return [...el.fields.children];
}
function goal(n, of){ return `<section class="tool"><h3>🏁 Completati</h3><p class="goal" aria-label="${n} di ${of}">${'★'.repeat(n)}${'☆'.repeat(of - n)}</p></section>`; }
function histHTML(rows){
  if (!rows.length) return '';
  return `<section class="tool"><h3>📋 I tuoi prati</h3><table class="hist"><thead><tr><th>#</th><th>${W_PER()}</th><th>${W_AREA()}</th></tr></thead><tbody>${rows.map((z, i) => `<tr><td>${i + 1}</td><td>${z.per} m</td><td>${plural(z.area, 'quadretto', 'quadretti')}</td></tr>`).join('')}</tbody></table></section>`;
}
function shapeIssue(f){
  if (!f.cells.size) return 'Il prato è vuoto: colora qualche quadretto.';
  if (!connected(f.cells)) return 'Il prato deve essere tutto in un pezzo: le pecore non saltano da un recinto all’altro.';
  return null;
}

/* Livelli 1 e 2: missioni su una griglia, con le pecore come conseguenza. */
function missionLevel(cfg){
  return {
    nav:cfg.nav, title:cfg.title, mission:cfg.mission,
    enter(){
      Object.assign(app.L, { round:0, hist:[] });
      const [host] = fieldsLayout(1);
      app.L.f = makeField(host, { cols:12, rows:9, onChange: () => this.live() });
      this.load();
    },
    load(){
      const L = app.L, R = cfg.rounds[L.round];
      L.phase = 'build';
      el.task.innerHTML = `<b>Missione ${L.round + 1} di ${cfg.rounds.length}.</b> ${R.text}`;
      L.f.lock(false); this.live(); this.render();
      app.say('info', 'Osserva', L.round === 0 ? 'Tocca i quadretti per farli diventare prato (o trascina il dito). Tocca un quadretto verde per toglierlo. Il recinto si costruisce da solo intorno al prato.' : 'Nuova missione: puoi modificare il prato che hai già.');
    },
    live(){
      const L = app.L;
      if (!L.f) return;
      if (cfg.roll){
        const p = L.f.m.per, over = p > cfg.roll;
        L.f.note(`<span class="roll${over ? ' over' : ''}" style="flex-basis:100%">Rotolo ${cfg.roll} m <span class="track"><span class="fill" style="width:${Math.min(100, p / cfg.roll * 100)}%"></span></span>${over ? `mancano ${p - cfg.roll} m!` : `restano ${cfg.roll - p} m`}</span>`);
      }
    },
    render(){
      const L = app.L, build = L.phase === 'build';
      el.tool.innerHTML = goal(L.round + (L.phase === 'won' ? 1 : 0), cfg.rounds.length)
        + `<section class="tool"><h3>🐑 Il pastore controlla</h3><div class="row">${build ? '<button class="btn" type="button" data-act="check">Fai entrare le pecore</button><button class="btn ghost-btn" type="button" data-act="clear">Svuota</button>' : (L.round < cfg.rounds.length - 1 ? '<button class="btn" type="button" data-act="next">Prossima missione →</button>' : '')}</div></section>`
        + histHTML(L.hist);
    },
    on: {
      clear(){ app.L.f.clear(); },
      check(){
        const L = app.L, f = L.f, R = cfg.rounds[L.round], issue = shapeIssue(f);
        if (issue) return app.say('tilt', 'Attento', issue);
        const { area, per } = f.m;
        const out = R.sheep ? f.sheep(R.sheep) : (f.sheep(area), 0);
        const msg = R.check(area, per);
        app.log(`Missione ${L.round + 1}: recinto ${per} m, prato ${area} ${msg ? '✗' : '✓'}`);
        if (msg) return app.say('error', 'Non ancora', msg + (out ? ` <span class="outside">${'🐑'.repeat(Math.min(out, 12))}</span> ${plural(out, 'pecora resta', 'pecore restano')} fuori.` : ''));
        L.hist.push({ area, per });
        L.phase = 'won'; f.lock(true);
        if (L.round < cfg.rounds.length - 1){ this.render(); return app.say('ok', 'Missione compiuta!', R.ok(area, per)); }
        this.render();
        app.say('win', 'Tutte le missioni compiute!', R.ok(area, per));
        app.complete(app.idx);
        app.win({ title: cfg.done.title, text: cfg.done.text, extra: histHTML(L.hist).replace('<section class="tool">', '<div>').replace('</section>', '</div>'), reflect: cfg.done.reflect, then: () => app.go(app.idx + 1) });
      },
      next(){ app.L.round++; this.load(); }
    }
  };
}
const L1 = missionLevel({
  nav:'1. Il rotolo', title:'Il rotolo da 20 metri', roll:20,
  mission:'Il pastore ha un rotolo di recinto lungo 20 metri. Ogni quadretto di prato ospita una pecora; ogni lato di quadretto è un metro di recinto.',
  rounds:[
    { text:'Recinta un prato usando <b>tutto il rotolo</b>: esattamente 20 m di recinto.', sheep:0,
      check:(a, p) => p === 20 ? null : p < 20 ? `Il recinto è lungo ${p} m: avanzano ${20 - p} m di rotolo.` : `Il recinto è lungo ${p} m, ma il rotolo è di 20 m.`,
      ok:(a) => `20 m di recinto e ${a} quadretti di prato.` },
    { text:'Arrivano <b>20 pecore</b>. Sempre con 20 m di recinto, fai un prato abbastanza grande per tutte.', sheep:20,
      check:(a, p) => p !== 20 ? `Il recinto è lungo ${p} m: deve essere di 20 m.` : a < 20 ? `Il prato ha ${a} quadretti.` : null,
      ok:(a) => `Tutte le pecore dentro! Stesso rotolo di prima, ma ora il prato ha ${a} quadretti.` },
    { text:'Le pecore ora sono <b>25</b>! Il rotolo è sempre quello da 20 m.', sheep:25,
      check:(a, p) => p !== 20 ? `Il recinto è lungo ${p} m: deve essere di 20 m.` : a < 25 ? `Il prato ha ${a} quadretti.` : null,
      ok:() => 'Venticinque pecore con soli 20 m di recinto: che forma ha il tuo prato?' },
    { text:'Il pastore vuole tenere l’erba per l’inverno: usa <b>tutti i 20 m</b> ma recinta <b>al massimo 9 quadretti</b>.', sheep:0,
      check:(a, p) => p !== 20 ? `Il recinto è lungo ${p} m: deve essere di 20 m.` : a > 9 ? `Il prato ha ${a} quadretti: troppi, al massimo 9.` : null,
      ok:(a) => `Con lo stesso rotolo hai chiuso solo ${a} quadretti.` }
  ],
  done:{ title:'Il rotolo non mente… o sì?', text:'Con lo stesso recinto hai costruito prati molto diversi:',
    reflect:'Lo stesso rotolo da 20 m ha chiuso prati di grandezza diversa. Quali forme danno il prato più grande? E quali il più piccolo?' }
});
const L2 = missionLevel({
  nav:'2. Dodici pecore', title:'Dodici pecore',
  mission:'Ora il pastore ha esattamente 12 pecore: il prato deve avere 12 quadretti, né uno di più né uno di meno. Il recinto però puoi sceglierlo tu.',
  rounds:[
    { text:'Il recinto costa caro: un prato di <b>12 quadretti</b> con <b>meno di 16 m</b> di recinto.', sheep:12,
      check:(a, p) => a !== 12 ? `Il prato ha ${a} quadretti: ne servono esattamente 12, uno per pecora.` : p >= 16 ? `Il recinto è lungo ${p} m: troppo, deve essere meno di 16 m.` : null,
      ok:(a, p) => `12 pecore con soli ${p} m di recinto.` },
    { text:'Un vicino regala al pastore tanto recinto: <b>12 quadretti</b> con <b>almeno 24 m</b> di recinto.', sheep:12,
      check:(a, p) => a !== 12 ? `Il prato ha ${a} quadretti: ne servono esattamente 12.` : p < 24 ? `Il recinto è lungo ${p} m: deve essere almeno 24 m.` : null,
      ok:(a, p) => `Stesse 12 pecore, ma ${p} m di recinto!` },
    { text:'<b>12 quadretti</b> e <b>esattamente 20 m</b> di recinto.', sheep:12,
      check:(a, p) => a !== 12 ? `Il prato ha ${a} quadretti: ne servono esattamente 12.` : p !== 20 ? `Il recinto è lungo ${p} m: deve essere di 20 m.` : null,
      ok:() => 'Perfetto: 12 quadretti e 20 m di recinto.' }
  ],
  done:{ title:'Dodici pecore, tanti recinti', text:'Lo stesso prato di 12 quadretti con recinti diversi:',
    reflect:'Stessa quantità di prato, ma recinti lunghi in modo diverso. Che forma ha il prato con il recinto più corto? E quello con il recinto più lungo?' }
});

/* ================================================================
   LIVELLO 3 — Vero o falso? Controesempi contro le frasi sbagliate.
   ================================================================ */
const CLAIMS = [
  { text:'Due prati con lo stesso recinto hanno anche lo stesso numero di quadretti.', truth:false,
    need:'Costruisci due prati con lo stesso recinto ma con un numero diverso di quadretti.',
    check:(A, B) => A.per !== B.per ? `I due recinti non sono uguali (${A.per} m e ${B.per} m).` : A.area === B.area ? 'I due prati hanno anche lo stesso numero di quadretti: qui la frase funziona.' : null,
    cex:() => [rect(0, 0, 4, 4), rect(0, 0, 7, 1)] },
  { text:'Il prato con il recinto più lungo è sempre anche il più grande.', truth:false,
    need:'Costruisci due prati: quello con il recinto più lungo deve avere meno quadretti.',
    check:(A, B) => A.per === B.per ? 'I due recinti sono lunghi uguali.' : ((A.per > B.per) === (A.area > B.area) && A.area !== B.area) ? 'Qui il prato con il recinto più lungo è proprio il più grande: la frase funziona.' : A.area === B.area ? 'I due prati hanno lo stesso numero di quadretti.' : null,
    cex:() => [rect(0, 0, 8, 1), rect(0, 0, 3, 3)] },
  { text:'Il recinto di un prato a quadretti è sempre lungo un numero pari di metri.', truth:true,
    need:'Per smentirla ti serve un prato con il recinto lungo un numero dispari di metri.',
    check:(A, B) => { const odd = [A, B].find(z => z.per % 2); return odd ? null : `I recinti sono lunghi ${A.per} m e ${B.per} m: numeri pari.`; },
    cex:() => null },
  { text:'Due prati con lo stesso numero di quadretti hanno anche lo stesso recinto.', truth:false,
    need:'Costruisci due prati con gli stessi quadretti ma recinti diversi.',
    check:(A, B) => A.area !== B.area ? `I prati hanno ${A.area} e ${B.area} quadretti: non sono uguali.` : A.per === B.per ? 'Anche i recinti sono uguali: qui la frase funziona.' : null,
    cex:() => [rect(0, 0, 6, 2), rect(0, 0, 4, 3)] },
  { text:'Se aggiungi un quadretto a un prato, il recinto diventa sempre più lungo.', truth:false,
    need:'Il prato B deve essere uguale al prato A con un quadretto in più, ma con un recinto non più lungo.',
    check:(A, B, a, b) => (b.size !== a.size + 1 || ![...a].every(k => b.has(k))) ? 'B deve essere uguale ad A, più un solo quadretto.' : B.per > A.per ? `Qui il recinto si è allungato: da ${A.per} m a ${B.per} m.` : null,
    cex:() => { const a = rect(0, 0, 2, 2); a.delete(key(1, 1)); return [a, rect(0, 0, 2, 2)]; } },
  { text:'Con 12 m di recinto non si possono chiudere più di 9 quadretti.', truth:true,
    need:'Per smentirla ti serve un prato con 12 m di recinto e più di 9 quadretti.',
    check:(A, B) => [A, B].some(z => z.per === 12 && z.area > 9) ? null : 'Nessuno dei due prati ha 12 m di recinto e più di 9 quadretti.',
    cex:() => null }
];
const L3 = {
  nav:'3. Vero o falso?', title:'Vero o falso?',
  mission:'Il signor Bastian Contrario dice tante cose sui prati. Alcune sono vere, altre no. Se una frase è falsa, dimostralo con un controesempio: costruisci i prati A e B che la smentiscono.',
  enter(){
    Object.assign(app.L, { i:0, res:[] });
    const [ha, hb] = fieldsLayout(2);
    app.L.A = makeField(ha, { cols:8, rows:6, label:'Prato A' });
    app.L.B = makeField(hb, { cols:8, rows:6, label:'Prato B' });
    L3.load();
  },
  load(){
    const L = app.L, C = CLAIMS[L.i];
    L.phase = 'think'; L.A.lock(false); L.B.lock(false);
    el.task.innerHTML = `<b>Frase ${L.i + 1} di ${CLAIMS.length}.</b> Bastian Contrario dice: «${C.text}»`;
    L3.render();
    app.say('info', 'Vera o falsa?', 'Se pensi che sia falsa, costruisci un controesempio nei prati A e B. Se pensi che sia vera, dillo: Bastian proverà a smentirti.');
  },
  render(){
    const L = app.L, C = CLAIMS[L.i], think = L.phase === 'think';
    el.tool.innerHTML = `<section class="tool"><h3>🗣️ La frase</h3><p class="claim"><small>Bastian Contrario dice</small>«${C.text}»</p>
      ${think ? `<div class="row"><button class="btn" type="button" data-act="falsa">È falsa: ecco il controesempio</button><button class="btn ghost-btn" type="button" data-act="vera">È vera</button></div>
      <button class="btn ghost-btn" type="button" data-act="clear">Svuota i prati</button>`
        : (L.i < CLAIMS.length - 1 ? '<button class="btn" type="button" data-act="next">Prossima frase →</button>' : '')}</section>
      <section class="tool"><h3>📋 Le frasi</h3><ul class="claims">${CLAIMS.map((z, i) => {
        const r = L.res[i];
        return `<li class="${r ? (r.ok ? 'ok' : 'lost') : i === L.i ? 'cur' : ''}"><span class="st">${r ? (r.ok ? '✓' : '✕') : i === L.i ? '▸' : '·'}</span><span>${r ? `<b>${z.truth ? 'Vera' : 'Falsa'}</b> — ` : ''}${i <= L.i ? esc(z.text) : '…'}</span></li>`;
      }).join('')}</ul></section>`;
  },
  settle(ok, title, html){
    const L = app.L;
    L.res[L.i] = { ok };
    L.phase = 'done'; L.A.lock(true); L.B.lock(true);
    app.log(`Frase ${L.i + 1}: ${ok ? '✓' : '✕'}`);
    L3.render();
    app.say(ok ? 'ok' : 'error', title, html);
    if (L.i === CLAIMS.length - 1){
      app.complete(2);
      const right = L.res.filter(r => r.ok).length;
      setTimeout(() => app.win({ title: 'Bastian è stato smascherato!', text: `Hai giudicato bene ${right} frasi su ${CLAIMS.length}.`, extra: `<ul class="dlg-list">${CLAIMS.map(z => `<li>${z.truth ? '✓ Vera' : '✕ Falsa'}: «${esc(z.text)}»</li>`).join('')}</ul>`, reflect: 'Per smentire una frase basta <b>un solo</b> controesempio. Per essere sicuri che una frase è vera, invece, non basta provarla qualche volta: bisogna capire <b>perché</b> funziona sempre. Sai spiegare perché il recinto è sempre pari?', then: () => app.go(3) }), 600);
    }
  },
  on: {
    clear(){ app.L.A.clear(); app.L.B.clear(); },
    falsa(){
      const L = app.L, C = CLAIMS[L.i];
      for (const [f, n] of [[L.A, 'A'], [L.B, 'B']]){ const issue = shapeIssue(f); if (issue) return app.say('tilt', `Prato ${n}`, issue); }
      const msg = C.check(L.A.m, L.B.m, L.A.cells, L.B.cells);
      if (msg) return app.say('tilt', 'Non è un controesempio', `${msg} ${C.need}`);
      L3.settle(true, 'Frase smentita!', `Il tuo controesempio funziona: prato A ${L.A.m.per} m e ${plural(L.A.m.area, 'quadretto', 'quadretti')}, prato B ${L.B.m.per} m e ${plural(L.B.m.area, 'quadretto', 'quadretti')}.`);
    },
    vera(){
      const L = app.L, C = CLAIMS[L.i];
      if (C.truth) return L3.settle(true, 'Bastian non trova controesempi', 'Ci ha provato in tutti i modi, ma la frase regge: è vera.');
      const [a, b] = C.cex();
      L.A.set(a); L.B.set(b);
      L3.settle(false, 'Bastian ti smentisce!', `Guarda i suoi prati: A ha ${L.A.m.per} m di recinto e ${plural(L.A.m.area, 'quadretto', 'quadretti')}, B ha ${L.B.m.per} m e ${plural(L.B.m.area, 'quadretto', 'quadretti')}. La frase era falsa.`);
    },
    next(){ app.L.i++; app.L.A.clear(); app.L.B.clear(); L3.load(); }
  }
};

/* ================================================================
   SFIDA — si può fare o no?
   ================================================================ */
const L4 = {
  nav:'⚡ Sfida', title:'Si può fare?', GOAL:5, challenge:true,
  mission:'Il pastore chiede prati con un certo numero di quadretti e un certo recinto. A volte si può, a volte no. Costruiscilo, oppure dichiara che è impossibile: il milieu controllerà.',
  enter(){
    Object.assign(app.L, { done:0, errors:0 });
    const [host] = fieldsLayout(1);
    app.L.f = makeField(host, { cols:12, rows:9 });
    L4.newTask();
  },
  gen(){
    for (;;){
      const a = rnd(4, 14);
      if (Math.random() < .55){
        const evens = []; for (let p = minPer(a); p <= maxPer(a); p += 2) evens.push(p);
        const p = pick(evens), sol = buildShape(a, p, 12, 9);
        if (sol) return { a, p, sol };
      } else {
        const opts = [minPer(a) + 1, maxPer(a) - 1, maxPer(a) + 2, maxPer(a) + 4];
        if (minPer(a) - 2 >= 4) opts.push(minPer(a) - 2);
        const p = pick(opts);
        if (!possible(a, p)) return { a, p, sol:null };
      }
    }
  },
  newTask(){
    const L = app.L;
    Object.assign(L, L4.gen(), { phase:'build' });
    L.f.clear(); L.f.lock(false);
    el.task.innerHTML = `Il pastore vuole un prato di <b>${plural(L.a, 'quadretto', 'quadretti')}</b> con <b>${L.p} m</b> di recinto.`;
    L4.render();
    app.say('info', 'Si può fare?', 'Costruisci il prato e controllalo, oppure dichiara che è impossibile.');
  },
  render(){
    const L = app.L, build = L.phase === 'build';
    el.tool.innerHTML = goal(L.done, L4.GOAL) + `<section class="tool"><h3>🧐 Il tuo verdetto</h3>
      ${build ? '<div class="row"><button class="btn" type="button" data-act="check">Ecco il prato</button><button class="btn ghost-btn" type="button" data-act="impossible">È impossibile!</button></div><button class="btn ghost-btn" type="button" data-act="clear">Svuota</button>'
        : (L.done < L4.GOAL ? '<button class="btn" type="button" data-act="next">Prossima richiesta →</button>' : '')}</section>`;
  },
  why(a, p){
    if (p % 2) return `Un recinto fatto di lati di quadretti è sempre lungo un numero pari di metri, e ${p} è dispari.`;
    if (p < minPer(a)) return `Con ${a} quadretti il recinto più corto possibile è di ${minPer(a)} m.`;
    return `Con ${a} quadretti il recinto più lungo possibile è di ${maxPer(a)} m.`;
  },
  win(title, html){
    const L = app.L;
    L.done++; L.phase = 'done'; L.f.lock(true);
    L4.render();
    if (L.done < L4.GOAL) return app.say('win', title, html);
    app.say('win', title, html);
    app.complete(3);
    app.win({ title: 'Pastore esperto!', text: `Cinque richieste risolte${L.errors ? `, con ${plural(L.errors, 'errore', 'errori')}` : ' senza errori'}.`, extra: `<div class="idcard"><ul>
        <li>L’<b>area</b> dice quanto prato c’è (quanti quadretti); il <b>perimetro</b> dice quanto è lungo il recinto (quanti lati di quadretto). Sono due misure <b>diverse</b>.</li>
        <li>Lo stesso perimetro può chiudere aree diverse, e la stessa area può avere perimetri diversi.</li>
        <li>Con lo stesso recinto, il prato più grande ha una forma raccolta, vicina al <b>quadrato</b>; i prati lunghi e stretti sono i più piccoli.</li>
        <li>Su una quadrettatura il perimetro è sempre un numero <b>pari</b>.</li></ul></div>`, next: 'Altre cinque richieste →', then: () => app.go(3) });
  },
  on: {
    clear(){ app.L.f.clear(); },
    check(){
      const L = app.L, issue = shapeIssue(L.f);
      if (issue) return app.say('tilt', 'Attento', issue);
      const { area, per } = L.f.m;
      app.log(`${L.a} quadretti / ${L.p} m: costruito ${area} / ${per} m`);
      if (area === L.a && per === L.p){ L.f.sheep(area); return L4.win('Si poteva fare!', `${plural(area, 'quadretto', 'quadretti')} e ${per} m di recinto: proprio quello che voleva il pastore.`); }
      L.errors++;
      app.say('error', 'Non è quello richiesto', `Il tuo prato ha ${plural(area, 'quadretto', 'quadretti')} e ${per} m di recinto; il pastore voleva ${L.a} quadretti e ${L.p} m.`);
    },
    impossible(){
      const L = app.L;
      app.log(`${L.a} quadretti / ${L.p} m: dichiarato impossibile`);
      if (!L.sol) return L4.win('Davvero impossibile!', `Nemmeno il milieu ci riesce. ${L4.why(L.a, L.p)}`);
      L.errors++;
      L.f.set(L.sol); L.f.lock(true); L.phase = 'shown';
      L.f.sheep(L.a);
      L4.render();
      app.say('error', 'Invece si può!', `Il milieu ha costruito un prato di ${plural(L.a, 'quadretto', 'quadretti')} con ${L.p} m di recinto. Guardalo bene.`);
    },
    next(){ L4.newTask(); }
  }
};

app.debug({ buildShape, measureShape, rect, key, possible, minPer, maxPer });
app.start([L1, L2, L3, L4]);
</script>
