<html lang="it">

<meta name="description" content="Un foglio è troppo sottile per misurarlo… ma una pila no. Misura pile di carta con il calibro e scopri le frazioni come misura: la situazione classica di Brousseau.">

<style>
.stage-card{overflow:auto}

/* ---------- Risme ---------- */
.reams{flex:none;display:flex;flex-wrap:wrap;gap:10px}
.ream{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;font:inherit;color:var(--ink);transition:border-color .2s,transform .15s var(--wobble),box-shadow .2s}
.ream:hover{border-color:#b9bff0}
.ream[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 0 0 4px rgba(67,56,202,.15);transform:translateY(-2px)}
.ream-ico{width:38px;height:30px;border-radius:4px;background:var(--c);position:relative;box-shadow:0 2px 0 var(--d),0 4px 0 #fff,0 5px 0 var(--d),0 7px 0 #fff,0 8px 0 var(--d)}
.ream-ico.double{background:linear-gradient(90deg,var(--c) 50%,var(--c2) 50%)}
.ream b{display:block;font-size:.95rem;line-height:1.15}
.ream small{display:block;font-size:.75rem;color:var(--muted);font-weight:650}
.ream small.ok{color:var(--ok)}

/* ---------- Calibro ---------- */
.bench{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.cal-wrap{flex:none;border:2px solid #e1e5f3;border-radius:16px;background:radial-gradient(ellipse at 50% 0%,#fff 0%,#f6f7fc 75%);padding:6px}
#cal{width:100%;height:auto;display:block}
#cal .beam{fill:url(#metal);stroke:#8a91b1;stroke-width:1.5}
#cal .tick{stroke:#3f4566;stroke-width:1.2}
#cal .tick.big{stroke-width:2}
#cal .tick.hit{stroke:var(--ok);stroke-width:4}
#cal .lab{fill:#3f4566;font:700 12px var(--font)}
#cal .jaw{fill:url(#metal);stroke:#5a6286;stroke-width:1.5}
#cal .slider{transition:transform .7s cubic-bezier(.3,.8,.3,1)}
#cal .needle{fill:var(--tilt-line)}
#cal .needle.exact{fill:var(--ok)}
#cal .stack{transition:width .7s cubic-bezier(.3,.8,.3,1)}
#cal .table{fill:#e7ebf8}
.reading{flex:none;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:#f3f4fb;font-weight:800;font-size:1.25rem;min-height:56px;text-align:center}
.reading.exact{background:var(--ok-soft);color:var(--ok)}
.reading.approx{background:var(--tilt-soft);color:var(--tilt)}
.reading small{font-size:.85rem;font-weight:650;color:var(--muted)}
.mlog{flex:1;min-height:110px;overflow:auto;border:2px solid var(--line);border-radius:14px;background:#fff}
.mlog table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.mlog th{position:sticky;top:0;background:#f3f4fb;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:7px 8px;text-align:left}
.mlog td{padding:6px 8px;border-top:1px solid #eef0f8;font-weight:700}
.mlog tr.exact td{color:var(--ok);background:#f2fbf9}
.mlog tr.new td{animation:rowflash 1.1s ease}
@keyframes rowflash{0%{background:var(--primary-soft)}}
.mlog-empty{margin:0;padding:12px;color:var(--muted);font-size:.86rem;text-align:center}

/* ---------- Messaggio e confronto ---------- */
.note-card{flex:none;border-radius:16px;padding:14px 16px;background:#fffdf3;border:2px dashed #e9c46a;box-shadow:0 6px 18px rgba(154,106,0,.08);transform:rotate(-.4deg)}
.note-card h3{margin:0 0 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:#9a6a00}
.note-card p{margin:0;font-size:1.15rem;font-weight:650}
.note-card .code{font-size:1.5rem;font-weight:850;color:var(--ink);white-space:nowrap}
.compare{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;justify-content:center}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pcard{border-radius:16px;border:2px solid var(--line);background:#fff;padding:14px;text-align:center}
.pcard h3{margin:0;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pcard .code{display:block;font-size:clamp(1.3rem,2.6vw,1.9rem);font-weight:850;margin-top:6px}
.pcard .frac{display:block;font-family:var(--math);color:#3a2b8f;font-size:1.2rem;margin-top:2px}
.bars{display:flex;flex-direction:column;gap:12px;border:2px solid var(--line);border-radius:16px;background:#fff;padding:14px}
.bar-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;font-weight:750}
.bar{height:38px;border-radius:6px;width:0;transition:width .9s cubic-bezier(.3,.8,.3,1);background:repeating-linear-gradient(90deg,var(--c) 0 6px,var(--d) 6px 7px);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-weight:850;white-space:nowrap;min-width:max-content}
.bars .cap{margin:0;color:var(--muted);font-size:.88rem;text-align:center}


/* ---------- Pannello ---------- */
.counter{display:flex;gap:6px;align-items:center}
.counter .pill{flex:none;width:46px}
.num-input{font-size:1.15rem;width:84px;height:44px}
.num-input.sm{width:70px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices .pill{width:100%;font-size:1rem}
.codes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.codes li{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;padding:6px 9px;border-radius:10px;background:#f7f8fd;border:1px solid #e6e9f5}
.codes .dot{flex:none;width:14px;height:14px;border-radius:4px;background:var(--c);margin-top:2px}
.codes .what{flex:1}
.codes .what b{font-weight:800}
.codes .none{color:var(--muted)}
.frac{font-family:var(--math);color:#3a2b8f;white-space:nowrap}
.sym-only{display:none!important}
body.sym-on .sym-only{display:inline!important}
body.sym-on .pcard .sym-only{display:block!important}
.answer-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:700}
.idcard .frac{font-size:1.1rem}

@media (max-width:920px){
  .mlog{max-height:220px}
}
@media (max-width:620px){
  .ream{padding:6px 9px 6px 6px}
  .ream-ico{width:28px;height:24px}
  .pair{grid-template-columns:1fr}
  #cal .lab{font-size:22px}
  #cal .tick{stroke-width:2}
}
</style>
</head>
<body class="fit">
<div class="app">
  <header class="topbar">
    <div class="brand">
      <a class="dd-back" href="/" aria-label="Tutti gli esperimenti dd" title="Tutti gli esperimenti"><span class="arr" aria-hidden="true">←</span>dd</a>
      <div class="logo" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 34 34" fill="none">
          <rect x="6" y="9" width="22" height="4" rx="1" fill="#fff"/><rect x="6" y="15" width="22" height="4" rx="1" fill="#ffd166"/><rect x="6" y="21" width="22" height="4" rx="1" fill="#fff"/>
          <path d="M3 5v24M31 5v24" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1>Lo spessore dei fogli</h1>
        <p>Un foglio è troppo sottile per misurarlo. Una pila no.</p>
      </div>
    </div>
    <nav class="levels" id="levels" aria-label="Livelli"></nav>
    <div class="top-tools">
      <div id="sym"></div>
      <button class="btn ghost-btn icon-btn" type="button" id="reset"></button>
    </div>
  </header>

  <main class="layout">
    <section class="card stage-card" aria-labelledby="missionTitle">
      <div class="mission" id="mission"></div>
      <div id="stage" class="bench"></div>
    </section>

    <aside class="card panel" aria-label="Strumenti">
      <div class="feedback info" id="feedback"></div>
      <div class="tools" id="tool"></div>
      <section class="tool" id="notebook" aria-labelledby="nbTitle">
        <h3 id="nbTitle">📒 Quaderno dei codici</h3>
        <p class="sub">Qui finiscono le misure esatte che trovi.</p>
        <ul class="codes" id="codes"></ul>
      </section>
      <details class="diario" id="diario"></details>
    </aside>
  </main>
</div>

<script type="module">
import { lab, $, plural, rnd, pick, shuffle, wait, reduceMotion } from '/_lab/lab.js';

/* Lo spessore dei fogli (G. Brousseau).
   Ogni carta ha uno spessore razionale m/d mm. Il calibro legge solo millimetri interi:
   la misura è esatta solo quando n·m/d è intero. Da qui nascono i codici "n fogli = k mm",
   la loro equivalenza, il confronto e la somma: le frazioni come misura. */

const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const lcm = (a, b) => a / gcd(a, b) * b;
const reduce = ({ m, d }) => { const g = gcd(m, d); return { m:m / g, d:d / g }; };
const MAX_MM = 30, MAX_N = 400;
const PALETTE = [
  { key:'rossa',  col:'#e5675b', dark:'#a1190f' },
  { key:'blu',    col:'#4f7cf0', dark:'#2747a8' },
  { key:'verde',  col:'#2bb39f', dark:'#0b6b62' },
  { key:'gialla', col:'#f2c14e', dark:'#9a6a00' },
  { key:'viola',  col:'#9b7af5', dark:'#5b3cc4' }
];
// Spessori in mm (m/d): abbastanza vicini da non distinguerli a occhio.
const POOL = [[1,10],[3,40],[2,25],[1,8],[3,20],[1,12],[2,15],[1,15],[3,25],[1,16],[3,50],[1,20],[4,25],[1,6],[2,35],[3,35]];

/* La scatola delle carte vive solo in questa pagina: ricaricando arriva una scatola nuova,
   così ogni coppia della classe riparte da zero. */
const box = (() => {
  const easy = shuffle(POOL.filter(([, d]) => d <= 40)).slice(0, 3);
  const rest = shuffle(POOL.filter(p => !easy.includes(p))).slice(0, 2);
  return [...easy, ...rest].map(([m, d], i) => ({ ...PALETTE[i], m, d, notes:[] }));
})();

const exactMm = (n, t) => (n * t.m) % t.d === 0 ? n * t.m / t.d : null;
const mmOf = (n, t) => n * t.m / t.d;
const codeText = (n, k) => `${n} fogli = ${k} mm`;
const fracHTML = (k, n) => `<span class="frac">${k}/${n} mm</span>`;
function readingText(T){
  if (Number.isInteger(T)) return T === 1 ? '1 mm esatto' : `${T} mm esatti`;
  const f = Math.floor(T);
  return f === 0 ? 'meno di 1 mm' : `tra ${f} e ${f + 1} mm`;
}

/* ---------------- Elementi ---------------- */
const el = { stage:$('#stage'), tool:$('#tool'), codes:$('#codes'), notebook:$('#notebook') };
const app = lab({ id:'fogli', sym:true, onLevel(){ el.notebook.hidden = false; } });

const coins = (n, max) => '<i class="coin"></i>'.repeat(n) + '<i class="coin used"></i>'.repeat(Math.max(0, max - n));
function focusFirst(){ if (matchMedia('(pointer: fine)').matches) el.tool.querySelector('input:not([disabled])')?.focus({ preventScroll:true }); }

/* ---------------- Quaderno ---------------- */
function exactCodes(p){ const seen = new Set(); return p.notes.filter(z => z.exact && !seen.has(z.n) && seen.add(z.n)).map(z => ({ n:z.n, k:z.T })); }
function renderNotebook(papers){
  el.codes.innerHTML = papers.map(p => {
    const codes = exactCodes(p);
    return `<li style="--c:${p.col}"><span class="dot" aria-hidden="true"></span><span class="what"><b>Carta ${p.key}:</b> ${codes.length
      ? codes.map(c => `${codeText(c.n, c.k)}<span class="sym-only"> → ${fracHTML(c.k, c.n)}</span>`).join(' · ')
      : '<span class="none">nessuna misura esatta</span>'}</span></li>`;
  }).join('');
}

/* ---------------- Calibro (SVG) ---------------- */
const X = mm => 60 + mm * 18;          // 1 mm = 18 unità
function calibroHTML(){
  let ticks = '';
  for (let mm = 0; mm <= MAX_MM; mm++){
    const big = mm % 5 === 0;
    ticks += `<line class="tick${big ? ' big' : ''}" data-mm="${mm}" x1="${X(mm)}" y1="62" x2="${X(mm)}" y2="${big ? 80 : 72}"/>`;
    if (big) ticks += `<text class="lab" x="${X(mm) + (mm ? 0 : 6)}" y="104" text-anchor="${mm ? 'middle' : 'start'}">${mm}</text>`;
  }
  return `<svg id="cal" viewBox="0 0 660 230" role="img" aria-label="Calibro: misura lo spessore della pila in millimetri">
    <defs>
      <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6fb"/><stop offset=".5" stop-color="#cfd5e6"/><stop offset="1" stop-color="#e9ecf5"/></linearGradient>
      <pattern id="sheets" width="4" height="10" patternUnits="userSpaceOnUse"><rect width="4" height="10" fill="#e5675b"/><rect class="ln" x="3.4" width=".6" height="10" fill="#a1190f"/></pattern>
    </defs>
    <rect class="table" x="20" y="196" width="620" height="10" rx="4"/>
    <rect class="beam" x="34" y="56" width="600" height="28" rx="4"/>
    ${ticks}
    <text class="lab" x="${X(MAX_MM) + 14}" y="74">mm</text>
    <rect class="jaw" x="${X(0) - 14}" y="56" width="14" height="140" rx="3"/>
    <rect class="stack" id="calStack" x="${X(0)}" y="118" width="0" height="78" fill="url(#sheets)"/>
    <g class="slider" id="calSlider" style="transform:translateX(${X(MAX_MM)}px)">
      <rect class="jaw" x="0" y="40" width="14" height="156" rx="3"/>
      <path class="needle" id="calNeedle" d="M-7 40 L7 40 L0 56 Z"/>
    </g>
  </svg>`;
}
const cal = {
  set(T, paper){
    const svg = $('#cal'); if (!svg) return;
    const t = Math.min(T, MAX_MM);
    svg.querySelectorAll('.tick.hit').forEach(n => n.classList.remove('hit'));
    $('#calSlider').style.transform = `translateX(${X(t)}px)`;
    const st = $('#calStack'); st.setAttribute('width', Math.max(0, X(t) - X(0)));
    if (paper){
      const pat = svg.querySelector('#sheets'), w = paper.sheetPx;
      pat.setAttribute('width', w);
      pat.querySelector('rect').setAttribute('width', w); pat.querySelector('rect').setAttribute('fill', paper.fill || paper.col);
      const ln = pat.querySelector('.ln'); ln.setAttribute('x', Math.max(0, w - .6)); ln.setAttribute('fill', paper.dark); ln.style.display = w >= 2.2 ? '' : 'none';
    }
    $('#calNeedle').classList.toggle('exact', Number.isInteger(T) && T > 0 && T <= MAX_MM);
    if (Number.isInteger(T) && T <= MAX_MM) setTimeout(() => svg.querySelector(`.tick[data-mm="${T}"]`)?.classList.add('hit'), reduceMotion ? 0 : 650);
  },
  open(){ cal.set(MAX_MM); $('#calStack')?.setAttribute('width', 0); $('#calNeedle')?.classList.remove('exact'); }
};
function setReading(T, n, extra = ''){
  const r = $('#reading'); if (!r) return;
  if (T === null){ r.className = 'reading'; r.innerHTML = 'Scegli quanti fogli e misura la pila.'; return; }
  const exact = Number.isInteger(T);
  r.className = 'reading ' + (exact ? 'exact' : 'approx');
  r.innerHTML = `${n} fogli → ${readingText(T)} ${exact ? '✓' : ''}${extra}`;
}

/* Misura "fisica": anima il calibro e restituisce la lettura. */
async function measure(paper, n, t){
  const T = mmOf(n, t);
  cal.open();
  await wait(220);
  cal.set(T, { col:paper.col, dark:paper.dark, fill:paper.fill, sheetPx: (X(T) - X(0)) / n });
  await wait(760);
  return T;
}

/* ---------------- Componenti di scena ---------------- */
function reamsHTML(papers, sel, opts = {}){
  return `<div class="reams" id="reamsBox" role="group" aria-label="Le carte">${papers.map((p, i) => {
    const codes = exactCodes(p);
    const status = opts.hideStatus ? '' : codes.length ? `<small class="ok">✓ ${codeText(codes[0].n, codes[0].k)}</small>` : `<small>${plural(p.notes.length, 'misura', 'misure')}</small>`;
    return `<button class="ream" type="button" data-act="sel" data-i="${i}" aria-pressed="${i === sel}" style="--c:${p.col};--d:${p.dark}"><span class="ream-ico" aria-hidden="true"></span><span><b>Carta ${p.key}</b>${status}</span></button>`;
  }).join('')}</div>`;
}
function mlogHTML(p, label){
  const rows = [...p.notes].reverse();
  return `<div class="mlog" id="mlogBox"><table><thead><tr><th>${label || `Misure della carta ${p.key}`}</th><th>Calibro</th></tr></thead><tbody>${rows.map((z, i) =>
    `<tr class="${z.exact ? 'exact' : ''}${i === 0 && z.fresh ? ' new' : ''}"><td>${z.n} fogli</td><td>${readingText(z.T)}${z.exact ? ' ✓' : ''}</td></tr>`).join('')}</tbody></table>
    ${rows.length ? '' : '<p class="mlog-empty">Ancora nessuna misura.</p>'}</div>`;
}
function swap(id, html){ const old = document.getElementById(id); if (old) old.outerHTML = html; }
function counterHTML(n, disabled){
  return `<div class="counter"><button class="pill" type="button" data-act="step" data-d="-10" ${disabled ? 'disabled' : ''}>−10</button><button class="pill" type="button" data-act="step" data-d="-1" ${disabled ? 'disabled' : ''}>−1</button>
    <label class="sr-only" for="nIn">Numero di fogli</label><input class="num-input" id="nIn" type="number" inputmode="numeric" min="1" max="${MAX_N}" value="${n}" data-input="setN" ${disabled ? 'disabled' : ''}>
    <button class="pill" type="button" data-act="step" data-d="1" ${disabled ? 'disabled' : ''}>+1</button><button class="pill" type="button" data-act="step" data-d="10" ${disabled ? 'disabled' : ''}>+10</button></div>`;
}
const counterActs = {
  step(b){ app.L.n = Math.max(1, Math.min(MAX_N, (app.L.n || 1) + Number(b.dataset.d))); const i = $('#nIn'); if (i) i.value = app.L.n; },
  setN(i){ const v = Math.round(Number(i.value)); if (Number.isFinite(v) && v >= 1) app.L.n = Math.min(MAX_N, v); }
};
function readN(){
  const v = Number($('#nIn')?.value);
  if (!Number.isInteger(v) || v < 1 || v > MAX_N){ app.say('tilt', 'Attento', `Scegli un numero intero di fogli da 1 a ${MAX_N}.`); return null; }
  app.L.n = v; return v;
}
async function doMeasure(p, t, n, tag){
  const gen = app.gen;
  app.busy = true;
  const T = await measure(p, n, t);
  if (gen !== app.gen) return null;
  app.busy = false;
  const exact = Number.isInteger(T) && T <= MAX_MM;
  p.notes.forEach(z => z.fresh = false);
  p.notes.push({ n, T, exact, fresh:true });
  setReading(T, n);
  app.log(`${tag || 'Carta ' + p.key}: ${n} fogli → ${readingText(T)}`);
  return T;
}

/* ================================================================
   LIVELLO 1 — Il calibro: trovare una pila che si misura esattamente.
   ================================================================ */
const L1 = {
  nav:'1. Il calibro', title:'Il calibro',
  mission:'Ecco tre risme di carta. Un solo foglio è troppo sottile per il calibro, che legge solo i millimetri interi. Per ogni carta trova una pila che il calibro misuri esattamente.',
  enter(){ Object.assign(app.L, { papers:box.slice(0, 3), sel:0, n:10 }); L1.paint(); app.say('info', 'Osserva', 'Scegli una carta, decidi quanti fogli mettere nella pila e premi <strong>Misura</strong>. Il calibro ti dirà se la misura è esatta.'); },
  paint(){
    const L = app.L, p = L.papers[L.sel];
    el.stage.innerHTML = reamsHTML(L.papers, L.sel) + `<div class="cal-wrap">${calibroHTML()}</div><div class="reading" id="reading" aria-live="polite"></div>` + mlogHTML(p);
    const last = p.notes[p.notes.length - 1];
    if (last){ cal.set(Math.min(last.T, MAX_MM), { col:p.col, dark:p.dark, sheetPx:(X(Math.min(last.T, MAX_MM)) - X(0)) / last.n }); setReading(last.T, last.n); } else { cal.open(); setReading(null); }
    L1.render(); renderNotebook(L.papers);
  },
  render(){
    const L = app.L, found = L.papers.filter(p => exactCodes(p).length).length;
    el.tool.innerHTML = `<section class="tool"><h3>📏 La pila</h3><p class="sub">Quanti fogli di carta <b>${L.papers[L.sel].key}</b>?</p>${counterHTML(L.n)}
      <button class="btn" type="button" data-act="measure">Misura la pila</button></section>
      <section class="tool"><h3>🎯 Misure esatte trovate</h3><p class="goal" aria-label="${found} di 3">${'★'.repeat(found)}${'☆'.repeat(3 - found)}</p></section>`;
    focusFirst();
  },
  on: {
    ...counterActs,
    sel(b){ app.L.sel = +b.dataset.i; L1.paint(); },
    async measure(){
      const L = app.L, p = L.papers[L.sel], n = readN();
      if (!n) return;
      if (mmOf(n, p) > MAX_MM) return app.say('tilt', 'Pila troppo alta', `Il calibro arriva solo fino a ${MAX_MM} mm: prova con meno fogli.`);
      const before = exactCodes(p).length, again = exactCodes(p).some(c => c.n === n);
      const T = await doMeasure(p, p, n);
      if (T === null) return;
      swap('reamsBox', reamsHTML(L.papers, L.sel)); swap('mlogBox', mlogHTML(p)); renderNotebook(L.papers); L1.render();
      if (!Number.isInteger(T)) return app.say('info', 'Non esatta', `${n} fogli di carta ${p.key}: il calibro si ferma <strong>${readingText(T)}</strong>. Prova con un altro numero di fogli.`);
      if (again) return app.say('info', 'La sapevi già', `${codeText(n, T)}: è già nel quaderno. Prova con un altro numero di fogli.`);
      if (before) return app.say('ok', 'Un’altra misura esatta', `Anche ${codeText(n, T)}! Che legame c’è con l’altra misura esatta della carta ${p.key}?`);
      const found = L.papers.filter(q => exactCodes(q).length).length;
      app.say('ok', 'Misura esatta!', `${n} fogli di carta ${p.key} misurano esattamente <strong>${T} mm</strong>. È scritto nel quaderno.${found < 3 ? ' Passa a un’altra carta.' : ''}`);
      if (found === 3){
        app.complete(0);
        app.win({ title: 'Tre misure esatte!', text: 'Hai trovato una pila misurabile per ogni carta.', extra: `<ul class="dlg-list">${L.papers.map(q => { const c = exactCodes(q)[0]; return `<li style="color:${q.dark}">Carta ${q.key}: ${codeText(c.n, c.k)}</li>`; }).join('')}</ul>`, reflect: 'Con questi codici puoi descrivere ogni carta senza mostrarla. Ma attenzione: una carta può avere <b>più</b> codici. Se 40 fogli misurano 3 mm, quanto misurano 80 fogli? E 120? Sono codici diversi della stessa carta?', then: () => app.go(1) });
      }
    }
  }
};

/* ================================================================
   LIVELLO 2 — Che carta è? Codici diversi, stessa carta.
   ================================================================ */
const L2 = {
  nav:'2. Che carta è?', title:'Che carta è?',
  mission:'Un’altra classe ha misurato le stesse carte e ti manda dei bigliettini. Scopri di quale carta parlano. Puoi fare solo 2 misure per bigliettino, ma il quaderno ti può aiutare.',
  GOAL:5, BUDGET:2,
  enter(){ Object.assign(app.L, { papers:box, sel:0, n:10, ok:0, last:null }); L2.newNote(); },
  newNote(){
    const L = app.L;
    let pi;
    do pi = rnd(0, 4); while (pi === L.last);
    const p = box[pi], ks = [2, 3, 4, 5, 6, 8].filter(k => k * p.d <= MAX_N && k * p.m <= MAX_MM);
    const k = pick(ks.length ? ks : [1]);
    Object.assign(L, { target:pi, last:pi, msg:{ n:k * p.d, k:k * p.m }, budget:L2.BUDGET, phase:'ask', answer:null });
    L2.paint();
    app.say('info', 'Nuovo bigliettino', `«${codeText(L.msg.n, L.msg.k)}». Quale carta della scatola è? Guarda il quaderno, fai al massimo 2 misure e poi rispondi.`);
  },
  paint(){
    const L = app.L, p = box[L.sel];
    el.stage.innerHTML = `<div class="note-card"><h3>✉️ Bigliettino dall’altra classe</h3><p>Abbiamo misurato una delle vostre carte: <span class="code">${codeText(L.msg.n, L.msg.k)}</span><span class="sym-only"> → ${fracHTML(L.msg.k, L.msg.n)}</span></p></div>`
      + reamsHTML(box, L.sel) + `<div class="cal-wrap">${calibroHTML()}</div><div class="reading" id="reading" aria-live="polite"></div>` + mlogHTML(p);
    cal.open(); setReading(null);
    L2.render(); renderNotebook(box);
  },
  render(){
    const L = app.L, done = L.phase !== 'ask';
    el.tool.innerHTML = `<section class="tool"><h3>🏁 Bigliettini risolti</h3><p class="goal" aria-label="${L.ok} di ${L2.GOAL}">${'★'.repeat(L.ok)}${'☆'.repeat(L2.GOAL - L.ok)}</p></section>
      <section class="tool"><h3>📏 Misure per questo bigliettino</h3><div class="coins" aria-label="Misure rimaste: ${L.budget}">${coins(L.budget, L2.BUDGET)}</div>
      ${counterHTML(L.n, done || !L.budget)}<button class="btn" type="button" data-act="measure" ${done || !L.budget ? 'disabled' : ''}>Misura la carta ${box[L.sel].key}</button></section>
      <section class="tool"><h3>🔍 La tua risposta</h3>
      ${done ? `<button class="btn" type="button" data-act="next">Prossimo bigliettino →</button>` : `<p class="sub">Seleziona una carta qui sopra, poi:</p><button class="btn" type="button" data-act="answer">È la carta ${box[L.sel].key}!</button>`}</section>`;
  },
  on: {
    ...counterActs,
    sel(b){ if (app.L.phase === 'ask'){ app.L.sel = +b.dataset.i; L2.paint(); } },
    async measure(){
      const L = app.L, p = box[L.sel], n = readN();
      if (!n || !L.budget) return;
      if (mmOf(n, p) > MAX_MM) return app.say('tilt', 'Pila troppo alta', `Il calibro arriva solo fino a ${MAX_MM} mm. La misura non è stata contata.`);
      L.budget--;
      const T = await doMeasure(p, p, n);
      if (T === null) return;
      swap('reamsBox', reamsHTML(box, L.sel)); swap('mlogBox', mlogHTML(p)); renderNotebook(box); L2.render();
      app.say('info', 'Misura fatta', `${n} fogli di carta ${p.key} → <strong>${readingText(T)}</strong>. ${L.budget ? 'Ti resta 1 misura.' : 'Misure finite: ora decidi.'}`);
    },
    async answer(){
      const L = app.L, p = box[L.sel], { n, k } = L.msg, gen = app.gen;
      L.phase = 'check'; L2.render();
      app.say('info', 'Verifica…', `Mettiamo ${n} fogli di carta ${p.key} nel calibro.`);
      app.busy = true;
      const T = await measure(p, n, p);
      if (gen !== app.gen) return;
      app.busy = false;
      const ok = Number.isInteger(T) && T === k;
      setReading(T, n, ok ? '' : ` <small>(il bigliettino diceva ${k} mm)</small>`);
      L.phase = 'done';
      if (ok) L.ok++;
      app.log(`Bigliettino «${codeText(n, k)}»: carta ${p.key} ${ok ? '✓' : '✕'}`);
      L2.render();
      if (!ok) return app.say('error', 'Non è questa', `${n} fogli di carta ${p.key} misurano <strong>${readingText(T)}</strong>, non ${k} mm. Il prossimo bigliettino parla di un’altra carta.`);
      if (L.ok < L2.GOAL) return app.say('win', 'Esatto!', `È proprio la carta ${p.key}.${exactCodes(p).length ? ` Nel quaderno avevi ${exactCodes(p).map(c => codeText(c.n, c.k)).join(', ')}: che legame c’è con il bigliettino?` : ''}`);
      app.say('win', 'Tutti i bigliettini risolti!', 'Cinque carte riconosciute.');
      app.complete(1);
      app.win({ title: 'Cinque bigliettini risolti!', text: 'Hai riconosciuto le carte anche quando il codice era diverso dal tuo.', reflect: 'Se 40 fogli misurano 3 mm, allora 80 fogli misurano 6 mm e 120 fogli 9 mm: sono <b>codici equivalenti</b> della stessa carta. Come fai a capire se due codici parlano della stessa carta, senza misurare?', then: () => app.go(2) });
    },
    next(){ L2.newNote(); }
  }
};

/* ================================================================
   LIVELLO 3 — Più spessa o più sottile? Confrontare i codici.
   ================================================================ */
const L3 = {
  nav:'3. Più spessa?', title:'Più spessa o più sottile?',
  mission:'Due carte misteriose, conosciute solo dal loro codice. Quale ha i fogli più spessi? La macchina impila lo stesso numero di fogli delle due carte e mostra chi aveva ragione.',
  GOAL:5,
  COLS:[{ col:'#4f7cf0', dark:'#2747a8' }, { col:'#e5675b', dark:'#a1190f' }],
  enter(){ Object.assign(app.L, { ok:0, errors:0 }); L3.newPair(); },
  gen(){
    for (let guard = 0; ; guard++){
      const f1 = pick(POOL), type = pick(['eq', 'close', 'close', 'trap']);
      const f2 = type === 'eq' ? f1 : pick(POOL.filter(f => f !== f1 && Math.abs(f[0] / f[1] - f1[0] / f1[1]) < .045));
      if (!f2) continue;
      const k1 = rnd(1, 4), k2 = type === 'eq' ? pick([1, 2, 3, 4, 5].filter(k => k !== k1)) : rnd(1, 4);
      const a = { n:k1 * f1[1], k:k1 * f1[0] }, b = { n:k2 * f2[1], k:k2 * f2[0] };
      if (type === 'trap' && guard < 300 && !(b.n > a.n && b.k > a.k && b.k / b.n < a.k / a.n)) continue;
      const N = lcm(a.n, b.n);
      if (N > 1200) continue;
      return Math.random() < .5 ? { x:a, y:b, N } : { x:b, y:a, N };
    }
  },
  newPair(){
    const L = app.L;
    Object.assign(L, L3.gen(), { phase:'ask' });
    L3.paint();
    app.say('info', 'Due carte misteriose', 'Quale carta ha i fogli più spessi? Rispondi senza misurare: hai solo i codici.');
  },
  paint(){
    const L = app.L, c = L3.COLS;
    const card = (name, z, i) => `<div class="pcard" style="border-color:${c[i].col}"><h3>Carta ${name}</h3><span class="code" style="color:${c[i].dark}">${codeText(z.n, z.k)}</span><span class="frac sym-only">${z.k}/${z.n} mm</span></div>`;
    let bars = '';
    if (L.phase === 'done'){
      const hx = L.N * L.x.k / L.x.n, hy = L.N * L.y.k / L.y.n, mx = Math.max(hx, hy);
      bars = `<div class="bars"><p class="cap">La macchina impila <b>${L.N} fogli</b> di ciascuna carta:</p>
        <div class="bar-row"><span>X</span><div class="bar" data-w="${hx / mx * 100}" style="--c:${c[0].col};--d:${c[0].dark}">${hx} mm</div></div>
        <div class="bar-row"><span>Y</span><div class="bar" data-w="${hy / mx * 100}" style="--c:${c[1].col};--d:${c[1].dark}">${hy} mm</div></div></div>`;
    }
    el.stage.innerHTML = `<div class="compare"><div class="pair">${card('X', L.x, 0)}${card('Y', L.y, 1)}</div>${bars}</div>`;
    if (bars) requestAnimationFrame(() => requestAnimationFrame(() => el.stage.querySelectorAll('.bar').forEach(b => b.style.width = b.dataset.w + '%')));
    el.notebook.hidden = true;
    L3.render();
  },
  render(){
    const L = app.L, ask = L.phase === 'ask';
    el.tool.innerHTML = `<section class="tool"><h3>🏁 Confronti giusti</h3><p class="goal" aria-label="${L.ok} di ${L3.GOAL}">${'★'.repeat(L.ok)}${'☆'.repeat(L3.GOAL - L.ok)}</p></section>
      <section class="tool"><h3>⚖️ Quale foglio è più spesso?</h3>
      ${ask ? `<div class="choices"><button class="pill" type="button" data-act="pick" data-v="x" style="border-color:${L3.COLS[0].col}">Carta X</button><button class="pill" type="button" data-act="pick" data-v="eq">Sono uguali</button><button class="pill" type="button" data-act="pick" data-v="y" style="border-color:${L3.COLS[1].col}">Carta Y</button></div>`
        : (L.ok < L3.GOAL ? '<button class="btn" type="button" data-act="next">Altre due carte →</button>' : '')}</section>`;
  },
  on: {
    pick(b){
      const L = app.L, hx = L.N * L.x.k / L.x.n, hy = L.N * L.y.k / L.y.n;
      const truth = hx === hy ? 'eq' : hx > hy ? 'x' : 'y', ok = b.dataset.v === truth;
      L.phase = 'done';
      if (ok) L.ok++; else L.errors++;
      app.log(`X ${codeText(L.x.n, L.x.k)} · Y ${codeText(L.y.n, L.y.k)}: ${ok ? '✓' : '✕'}`);
      L3.paint();
      const says = truth === 'eq' ? 'le due pile sono alte uguali: è la stessa carta!' : `la pila della carta ${truth.toUpperCase()} è più alta.`;
      if (!ok) return app.say('error', 'Non è così', `Con ${L.N} fogli ciascuna, ${says}`);
      if (L.ok < L3.GOAL) return app.say('ok', 'Giusto!', `Con ${L.N} fogli ciascuna, ${says}`);
      app.say('win', 'Cinque confronti giusti!', `Con ${L.N} fogli ciascuna, ${says}`);
      app.complete(2);
      app.win({ title: 'Occhio da esperto!', text: `Cinque confronti giusti${L.errors ? ` (e ${plural(L.errors, 'sbaglio', 'sbagli')} lungo la strada)` : ''}.`, reflect: 'Un codice con numeri più grandi non vuol dire fogli più spessi! Per confrontare due carte conviene immaginare pile con lo <b>stesso numero di fogli</b>: allora vince la pila più alta. Oppure pile della stessa altezza: allora è più spessa la carta che ha bisogno di meno fogli.', then: () => app.go(3) });
    },
    next(){ L3.newPair(); }
  }
};

/* ================================================================
   LIVELLO 4 — Il foglio doppio: sommare gli spessori.
   ================================================================ */
const L4 = {
  nav:'4. Il foglio doppio', title:'Il foglio doppio',
  mission:'La fabbrica incolla un foglio di una carta e uno di un’altra: nasce una carta doppia. Trova il codice della carta doppia e mettilo alla prova con il calibro.',
  GOAL:3,
  enter(){ Object.assign(app.L, { done:0, used:[] }); L4.newPair(); },
  sumOf: (a, b) => reduce({ m:a.m * b.d + b.m * a.d, d:a.d * b.d }),
  pairs(){
    const out = [];
    for (let i = 0; i < 5; i++) for (let j = i + 1; j < 5; j++){
      const a = box[i], b = box[j], s = L4.sumOf(a, b);
      if (s.d <= MAX_N && s.m <= MAX_MM && s.d !== a.d && s.d !== b.d) out.push([a, b, s]);
    }
    return out;
  },
  newPair(){
    const L = app.L, id = ([a, b]) => a.key + '-' + b.key;
    let list = L4.pairs().filter(z => !L.used.includes(id(z)));
    if (!list.length) list = L4.pairs();
    if (!list.length){ // scatola sfortunata: due carte di riserva, la scatola resta com'è
      const a = { ...PALETTE[0], m:1, d:10, notes:[] }, b = { ...PALETTE[1], m:1, d:15, notes:[] };
      list = [[a, b, L4.sumOf(a, b)]];
    }
    const pair = pick(list), [a, b, s] = pair;
    L.used.push(id(pair));
    Object.assign(L, { a, b, sum:s, n:10, phase:'work',
      dbl:{ key:`${a.key}-${b.key}`, col:a.col, dark:a.dark, fill:`url(#dbl)`, notes:[] } });
    L4.paint();
    app.say('info', 'Una carta nuova', `Un foglio di carta ${a.key} incollato a un foglio di carta ${b.key}. Quanto è spesso il foglio doppio? Misura pile di fogli doppi e trova un codice esatto.`);
  },
  paint(){
    const L = app.L, a = L.a, b = L.b;
    el.stage.innerHTML = `<div class="note-card"><h3>🧪 La ricetta della carta doppia</h3><p>1 foglio di <b style="color:${a.dark}">carta ${a.key}</b> <small>(${codeText(a.d, a.m)})</small> + 1 foglio di <b style="color:${b.dark}">carta ${b.key}</b> <small>(${codeText(b.d, b.m)})</small></p></div>
      <div class="reams"><div class="ream" style="--c:${a.col};--d:${a.dark};--c2:${b.col};cursor:default"><span class="ream-ico double" aria-hidden="true"></span><span><b>Carta doppia</b><small>${plural(L.dbl.notes.length, 'misura', 'misure')}</small></span></div></div>
      <div class="cal-wrap">${calibroHTML()}</div><div class="reading" id="reading" aria-live="polite"></div>` + mlogHTML(L.dbl, 'Misure della carta doppia');
    const pat = $('#cal defs');
    pat.insertAdjacentHTML('beforeend', `<pattern id="dbl" width="8" height="10" patternUnits="userSpaceOnUse"><rect width="4" height="10" fill="${a.col}"/><rect x="4" width="4" height="10" fill="${b.col}"/></pattern>`);
    const last = L.dbl.notes[L.dbl.notes.length - 1];
    if (last){ cal.set(Math.min(last.T, MAX_MM), null); $('#calStack').setAttribute('fill', 'url(#dbl)'); setReading(last.T, last.n); }
    else { cal.open(); setReading(null); }
    el.notebook.hidden = false; renderNotebook([a, b]);
    L4.render();
  },
  render(){
    const L = app.L, work = L.phase === 'work';
    el.tool.innerHTML = `<section class="tool"><h3>🏁 Carte doppie risolte</h3><p class="goal" aria-label="${L.done} di ${L4.GOAL}">${'★'.repeat(L.done)}${'☆'.repeat(L4.GOAL - L.done)}</p></section>
      <section class="tool"><h3>📏 Pila di fogli doppi</h3>${counterHTML(L.n, !work)}<button class="btn" type="button" data-act="measure" ${work ? '' : 'disabled'}>Misura la pila</button></section>
      <section class="tool"><h3>🏷️ Il codice della carta doppia</h3>
      ${work ? `<form class="answer-row" data-act="answer"><input class="num-input sm" name="n" type="number" inputmode="numeric" min="1" aria-label="Numero di fogli doppi" placeholder="?"><span>fogli doppi =</span><input class="num-input sm" name="k" type="number" inputmode="numeric" min="1" aria-label="Millimetri" placeholder="?"><span>mm</span><button class="btn" type="submit" style="flex:1 0 100%">Mettilo alla prova</button></form>`
        : (L.done < L4.GOAL ? '<button class="btn" type="button" data-act="next">Un’altra carta doppia →</button>' : '')}</section>`;
  },
  on: {
    ...counterActs,
    async measure(){
      const L = app.L, n = readN();
      if (!n) return;
      if (mmOf(n, L.sum) > MAX_MM) return app.say('tilt', 'Pila troppo alta', `Il calibro arriva solo fino a ${MAX_MM} mm: prova con meno fogli.`);
      const T = await doMeasure(L.dbl, L.sum, n, 'Carta doppia');
      if (T === null) return;
      swap('mlogBox', mlogHTML(L.dbl, 'Misure della carta doppia')); L4.render();
      app.say(Number.isInteger(T) ? 'ok' : 'info', Number.isInteger(T) ? 'Misura esatta!' : 'Non esatta', `${n} fogli doppi → <strong>${readingText(T)}</strong>.`);
    },
    async answer(form){
      const L = app.L, n = Number(form.n.value), k = Number(form.k.value);
      if (!Number.isInteger(n) || n < 1 || !Number.isInteger(k) || k < 1) return app.say('tilt', 'Attento', 'Scrivi due numeri interi: quanti fogli doppi e quanti millimetri.');
      const ok = n * L.sum.m === k * L.sum.d;
      app.log(`Codice proposto: ${n} fogli doppi = ${k} mm ${ok ? '✓' : '✕'}`);
      if (n * L.sum.m / L.sum.d <= MAX_MM){
        const T = await doMeasure(L.dbl, L.sum, n, 'Verifica');
        if (T === null) return;
        swap('mlogBox', mlogHTML(L.dbl, 'Misure della carta doppia'));
        setReading(T, n, ok ? '' : ` <small>(tu avevi scritto ${k} mm)</small>`);
      }
      if (!ok) return app.say('error', 'Il calibro non è d’accordo', n * L.sum.m / L.sum.d <= MAX_MM
        ? `${n} fogli doppi misurano <strong>${readingText(mmOf(n, L.sum))}</strong>, non ${k} mm.`
        : `${n} fogli doppi sono troppi per il calibro, ma di sicuro non misurano ${k} mm. Prova a ragionare con pile più piccole.`);
      L.done++; L.phase = 'done'; L4.render();
      const a = L.a, b = L.b;
      if (L.done < L4.GOAL) return app.say('win', 'Codice giusto!', `La carta doppia: ${codeText(n, k)}.${app.sym ? ` In simboli: ${a.m}/${a.d} + ${b.m}/${b.d} = ${L.sum.m}/${L.sum.d} mm.` : ''}`);
      app.say('win', 'Tre carte doppie!', 'Hai trovato il codice di tre carte doppie.');
      app.complete(3);
      app.win({ title: 'Sei un esperto di carta!', text: 'Hai misurato, riconosciuto, confrontato e incollato carte.', extra: `<div class="idcard"><ul>
          <li>Se <b>40 fogli = 3 mm</b>, un foglio è spesso <span class="frac">3/40 mm</span>: tre millimetri divisi in quaranta parti. È una <b>frazione</b>.</li>
          <li>Codici diversi possono descrivere la stessa carta: <span class="frac">3/40 = 6/80 = 9/120</span>. Sono <b>frazioni equivalenti</b>.</li>
          <li>Per <b>confrontare</b> due carte si usano pile con lo stesso numero di fogli: è come dare alle frazioni lo stesso denominatore.</li>
          <li>Per <b>sommare</b> gli spessori (il foglio doppio) si fa lo stesso: pile con lo stesso numero di fogli, poi si sommano i millimetri.</li></ul></div>`, next: 'Ricomincia dal livello 1 →', then: () => app.go(0) });
    },
    next(){ L4.newPair(); }
  }
};

/* ---------------- Collegamenti ---------------- */
el.tool.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'nIn'){ e.preventDefault(); if (!app.busy) app.level.on.measure(); }
});

app.debug({ box });
app.start([L1, L2, L3, L4]);
</script>
