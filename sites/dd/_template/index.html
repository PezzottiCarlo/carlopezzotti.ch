<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il numero nascosto</title>
<meta name="description" content="Il Milieu pensa un numero e risponde solo «più grande» o «più piccolo». Con quanti tentativi lo trovi? L'esperimento modello del laboratorio dd.">
<meta name="dd:tags" content="modello, aritmetica, strategia">
<meta name="dd:date" content="2026-10-24">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/_lab/lab.css">
<!--
  Esperimento modello del laboratorio: per partire da qui usa
    npm run new -- <cartella> "Titolo"
  Cornice, livelli, feedback, diario, dialogo e coriandoli vengono da /_lab/ (docs/lab.md):
  in questo file restano solo la scena e le regole del gioco.
-->
<style>
/* Solo gli stili della scena: tutto il resto è in lab.css. */
.stage-card{overflow:auto}
.line{display:grid;grid-template-columns:repeat(var(--cols,10),minmax(0,1fr));gap:6px;container-type:inline-size}
.num{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:clamp(.8rem,2.4cqi,1.2rem);color:var(--ink);cursor:pointer;padding:0;transition:background .2s,border-color .2s,opacity .2s,transform .12s}
.num:hover:not(:disabled){border-color:var(--primary);transform:translateY(-2px)}
.num:disabled{opacity:.28;cursor:default}
.num.tried{background:var(--tilt-soft);border-color:var(--tilt-line);opacity:1}
.num.found{background:var(--win);border-color:var(--win);color:#fff;opacity:1}
.clues{display:flex;flex-wrap:wrap;gap:6px}
.clue{font-weight:750;font-size:.9rem;padding:4px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary-dark)}
.clue.math{font-size:1rem;white-space:nowrap}
</style>
</head>
<body class="fit">
<div class="app">
  <header class="topbar">
    <div class="brand">
      <a class="dd-back" href="/" aria-label="Tutti gli esperimenti dd" title="Tutti gli esperimenti"><span class="arr" aria-hidden="true">←</span>dd</a>
      <div class="logo" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 34 34" fill="none">
          <path d="M4 22h26" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <path d="M8 18v8M14 18v8M20 18v8M26 18v8" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".7"/>
          <circle cx="20" cy="10" r="5" fill="#ffd166"/><path d="M20 15v3" stroke="#ffd166" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1>Il numero nascosto</h1>
        <p>Il Milieu risponde solo «più grande» o «più piccolo».</p>
      </div>
    </div>
    <nav class="levels" id="levels" aria-label="Livelli"></nav>
    <div class="top-tools">
      <div id="sym"></div>
      <button class="btn ghost-btn icon-btn" type="button" id="reset"></button>
    </div>
  </header>

  <main class="layout">
    <section class="card stage-card" aria-labelledby="missionTitle">
      <div class="mission" id="mission"></div>
      <div id="stage"></div>
    </section>
    <aside class="card panel" aria-label="Strumenti">
      <div class="feedback info" id="feedback"></div>
      <div class="tools" id="tools"></div>
      <details class="diario" id="diario" data-empty="Nessun tentativo."></details>
    </aside>
  </main>
</div>

<script type="module">
import { lab, $, rnd, plural } from '/_lab/lab.js';

const el = { stage:$('#stage'), tools:$('#tools') };

// id: prefisso dei progressi in localStorage. sym: l'interruttore "Simboli" (qui: indizi come disuguaglianze).
const app = lab({ id:'numero', sym:{ onChange(){ app.level.render(); } } });

// Un indizio a parole o in simboli, secondo l'interruttore.
const clue = (n, dir) => app.sym ? `<span class="clue math">x ${dir > 0 ? '>' : '<'} ${n}</span>` : `<span class="clue">più ${dir > 0 ? 'grande' : 'piccolo'} di ${n}</span>`;

// I livelli sono oggetti: enter() prepara la scena, on: { … } risponde ai data-act. Dentro on, this è il livello.
const level = ({ nav, title, mission, max, tries, challenge }) => ({
  nav, title, mission, challenge,
  enter(){
    // app.L è lo stato del livello: il laboratorio lo svuota a ogni ingresso.
    Object.assign(app.L, { secret:rnd(1, max), lo:1, hi:max, left:tries, clues:[], over:false });
    this.render();
    app.say('info', 'Osserva', `Ho pensato un numero tra 1 e ${max}. Tocca un numero sulla linea${tries ? `: hai ${plural(tries, 'tentativo', 'tentativi')}` : ''}.`);
  },
  render(){
    const L = app.L;
    el.stage.innerHTML = `<div class="line" style="--cols:${max > 20 ? 20 : 10}">${Array.from({ length:max }, (_, i) => i + 1).map(n =>
      `<button class="num${L.clues.some(c => c.n === n) ? ' tried' : ''}${L.over && n === L.secret ? ' found' : ''}" type="button" data-act="guess" data-n="${n}" ${L.over || n < L.lo || n > L.hi ? 'disabled' : ''}>${n}</button>`).join('')}</div>`;
    el.tools.innerHTML = `<section class="tool"><h3>🔎 Indizi</h3>
        <div class="clues">${L.clues.filter(c => c.dir).map(c => clue(c.n, c.dir)).join('') || '<span class="sub">Ancora nessuno.</span>'}</div></section>`
      + (tries ? `<section class="tool"><h3>🪙 Gettoni</h3><div class="coins" aria-label="Tentativi rimasti: ${L.left}">${'<i class="coin"></i>'.repeat(L.left)}${'<i class="coin used"></i>'.repeat(tries - L.left)}</div></section>` : '')
      + (L.over ? '<button class="btn" type="button" data-act="again">Un altro numero ↺</button>' : '');
  },
  on: {
    guess(btn){
      const L = app.L, n = Number(btn.dataset.n);
      if (L.over) return;
      const dir = Math.sign(L.secret - n);
      L.clues.push({ n, dir });
      if (tries) L.left--;
      app.log(`${n}: ${dir ? `più ${dir > 0 ? 'grande' : 'piccolo'}` : 'trovato! ✓'}`);
      if (dir > 0) L.lo = n + 1;
      if (dir < 0) L.hi = n - 1;
      if (!dir) return this.found();
      if (tries && !L.left){
        L.over = true; this.render();
        return app.say('error', 'Tentativi finiti', `Era <strong>${L.secret}</strong>. Riguarda gli indizi: quale numero ti dava più informazioni?`);
      }
      this.render();
      app.say('tilt', `Più ${dir > 0 ? 'grande' : 'piccolo'}`, `Il numero nascosto è più ${dir > 0 ? 'grande' : 'piccolo'} di ${n}. Restano ${L.hi - L.lo + 1} numeri possibili.`);
    },
    again(){ this.enter(); }
  },
  found(){
    const L = app.L, used = L.clues.length;
    L.over = true; this.render();
    app.say('win', 'Trovato!', `Era proprio ${L.secret}, in ${plural(used, 'tentativo', 'tentativi')}.`);
    const last = app.idx === app.levels.length - 1;
    app.complete();
    app.win({
      title: 'Numero trovato!',
      text: `Era <strong>${L.secret}</strong>: ci sono voluti ${plural(used, 'tentativo', 'tentativi')}.`,
      reflect: 'Quale numero conviene dire per primo? Ogni risposta del Milieu toglie una parte dei numeri possibili: quale scelta ne toglie di più, comunque risponda?',
      next: last ? 'Un altro numero →' : 'Livello successivo →',
      then: () => last ? app.restart() : app.next()
    });
  }
});

app.debug();
app.start([
  level({ nav:'1. Da 1 a 20', title:'Da 1 a 20', mission:'Il Milieu ha pensato un numero da 1 a 20. Prova quanto vuoi: ogni volta ti dice se è più grande o più piccolo.', max:20, tries:0 }),
  level({ nav:'2. Cinque gettoni', title:'Cinque gettoni', mission:'Stessi numeri, ma ora hai solo 5 tentativi. Basteranno sempre?', max:20, tries:5 }),
  level({ nav:'⚡ Sfida', title:'Da 1 a 100', mission:'Cento numeri e 7 tentativi. Serve una strategia.', max:100, tries:7, challenge:true })
]);
</script>
</body>
</html>
